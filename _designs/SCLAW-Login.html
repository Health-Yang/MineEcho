<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINECHO - 登录</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/antd/5.12.8/reset.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0066ff;
      --primary-light: #e6f0ff;
      --orange: #f5a623;
      --orange-dark: #e09000;
      --text-primary: #1f2329;
      --text-secondary: #646a73;
      --border: #e8ecf1;
      --bg: #f5f7fa;
      --white: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text-primary);
    }
    .login-container {
      display: flex;
      min-height: 100vh;
    }
    .left-panel {
      flex: 1;
      background: linear-gradient(135deg, var(--primary) 0%, #0055dd 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
      position: relative;
      overflow: hidden;
    }
    .left-panel::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      top: -100px;
      right: -100px;
    }
    .left-panel::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(255,255,255,0.03);
      bottom: -50px;
      left: -50px;
    }
    .left-content {
      position: relative;
      z-index: 1;
      text-align: center;
      color: white;
    }
    .left-content h1 {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }
    .left-content p {
      font-size: 18px;
      opacity: 0.9;
      line-height: 1.6;
      max-width: 400px;
    }
    .features {
      margin-top: 48px;
      text-align: left;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      font-size: 15px;
    }
    .feature-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .right-panel {
      width: 520px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px;
    }
    .login-form {
      width: 100%;
      max-width: 380px;
    }
    .logo-section {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }
    .fox-logo {
      width: 40px;
      height: 40px;
    }
    .form-title {
      font-size: 28px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .form-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s;
      outline: none;
      font-family: inherit;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0,102,255,0.1);
    }
    .form-input::placeholder {
      color: #bfbfbf;
    }
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .remember-me input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }
    .forgot-password {
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
      cursor: pointer;
    }
    .forgot-password:hover {
      text-decoration: underline;
    }
    .login-button {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 24px;
      font-family: inherit;
    }
    .login-button:hover {
      background: #0055dd;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0,102,255,0.3);
    }
    .login-button:active {
      transform: translateY(0);
    }
    .login-button:disabled {
      background: #bfbfbf;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider-text {
      font-size: 13px;
      color: var(--text-secondary);
    }
    .social-login {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
    }
    .social-button {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text-primary);
      transition: all 0.2s;
      font-family: inherit;
    }
    .social-button:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .register-section {
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .register-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }
    .register-link:hover {
      text-decoration: underline;
    }
    .version-badge {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-size: 11px;
      color: rgba(255,255,255,0.5);
    }
    .tabs {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 12px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.2s;
    }
    .tab:hover {
      color: var(--text-primary);
    }
    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .input-wrapper {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #bfbfbf;
    }
    .input-wrapper input {
      padding-left: 40px;
    }
    .error-message {
      color: #ff4d4f;
      font-size: 12px;
      margin-top: 4px;
    }
    @media (max-width: 900px) {
      .left-panel {
        display: none;
      }
      .right-panel {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- Left Panel - Branding -->
    <div class="left-panel">
      <div class="left-content">
        <svg class="fox-logo" width="100" height="100" viewBox="0 0 120 120" style="margin-bottom: 24px;">
          <circle cx="60" cy="60" r="56" fill="#fff" stroke="#0066ff" stroke-width="3"/>
          <path d="M30 42 L24 16 Q30 12 40 18 L44 36" fill="#f5a623" stroke="#e09000" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M90 42 L96 16 Q90 12 80 18 L76 36" fill="#f5a623" stroke="#e09000" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M32 38 L28 20 Q32 18 36 22 L38 34" fill="#e6f0ff"/>
          <path d="M88 38 L92 20 Q88 18 84 22 L82 34" fill="#e6f0ff"/>
          <ellipse cx="60" cy="58" rx="34" ry="30" fill="#f5a623" stroke="#e09000" stroke-width="2.5"/>
          <ellipse cx="42" cy="64" rx="16" ry="13" fill="#fff5e0"/>
          <ellipse cx="78" cy="64" rx="16" ry="13" fill="#fff5e0"/>
          <ellipse cx="48" cy="54" rx="6" ry="7" fill="#5a3a1a"/>
          <ellipse cx="72" cy="54" rx="6" ry="7" fill="#5a3a1a"/>
          <circle cx="50" cy="52" r="2.5" fill="#fff"/>
          <circle cx="74" cy="52" r="2.5" fill="#fff"/>
          <ellipse cx="60" cy="64" rx="5" ry="3.5" fill="#2d2d3d"/>
          <path d="M60 67 Q56 72 52 70" fill="none" stroke="#2d2d3d" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M60 67 Q64 72 68 70" fill="none" stroke="#2d2d3d" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <h1>MINECHO</h1>
        <p>深信服工程师专属 AI 智能助手，让工作更高效</p>

        <div class="features">
          <div class="feature-item">
            <div class="feature-icon">💬</div>
            <span>智能对话，精准理解工程师需求</span>
          </div>
          <div class="feature-item">
            <div class="feature-icon">⚡</div>
            <span>代码助手，快速生成与调试</span>
          </div>
          <div class="feature-item">
            <div class="feature-icon">📚</div>
            <span>知识库管理，沉淀团队智慧</span>
          </div>
          <div class="feature-item">
            <div class="feature-icon">🎙️</div>
            <span>会议纪要，智能转录总结</span>
          </div>
        </div>
      </div>
      <div class="version-badge">v4.0.0</div>
    </div>

    <!-- Right Panel - Form -->
    <div class="right-panel">
      <div class="login-form">
        <div class="logo-section">
          <svg class="fox-logo" width="40" height="40" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="56" fill="#fff" stroke="#0066ff" stroke-width="3"/>
            <path d="M30 42 L24 16 Q30 12 40 18 L44 36" fill="#f5a623" stroke="#e09000" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M90 42 L96 16 Q90 12 80 18 L76 36" fill="#f5a623" stroke="#e09000" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M32 38 L28 20 Q32 18 36 22 L38 34" fill="#e6f0ff"/>
            <path d="M88 38 L92 20 Q88 18 84 22 L82 34" fill="#e6f0ff"/>
            <ellipse cx="60" cy="58" rx="34" ry="30" fill="#f5a623" stroke="#e09000" stroke-width="2.5"/>
            <ellipse cx="42" cy="64" rx="16" ry="13" fill="#fff5e0"/>
            <ellipse cx="78" cy="64" rx="16" ry="13" fill="#fff5e0"/>
            <ellipse cx="48" cy="54" rx="6" ry="7" fill="#5a3a1a"/>
            <ellipse cx="72" cy="54" rx="6" ry="7" fill="#5a3a1a"/>
            <circle cx="50" cy="52" r="2.5" fill="#fff"/>
            <circle cx="74" cy="52" r="2.5" fill="#fff"/>
            <ellipse cx="60" cy="64" rx="5" ry="3.5" fill="#2d2d3d"/>
            <path d="M60 67 Q56 72 52 70" fill="none" stroke="#2d2d3d" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M60 67 Q64 72 68 70" fill="none" stroke="#2d2d3d" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span style="font-size: 20px; font-weight: 600; color: var(--text-primary);">MINECHO</span>
        </div>

        <!-- Tabs -->
        <div class="tabs">
          <div class="tab active" data-tab="login">登录</div>
          <div class="tab" data-tab="register">注册</div>
        </div>

        <!-- Login Form -->
        <div class="tab-content active" id="login-tab">
          <div class="form-group">
            <label class="form-label">邮箱地址</label>
            <div class="input-wrapper">
              <span class="input-icon">📧</span>
              <input type="email" class="form-input" id="login-email" placeholder="请输入邮箱">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">密码</label>
            <input type="password" class="form-input" id="login-password" placeholder="请输入密码">
          </div>
          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="remember-me">
              <span>记住我</span>
            </label>
            <span class="forgot-password">忘记密码？</span>
          </div>
          <button class="login-button" id="login-btn">登录</button>
          <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">或</span>
            <div class="divider-line"></div>
          </div>
          <div class="register-section">
            还没有账号？<span class="register-link" data-switch="register">立即注册</span>
          </div>
        </div>

        <!-- Register Form -->
        <div class="tab-content" id="register-tab">
          <div class="form-group">
            <label class="form-label">用户名</label>
            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input type="text" class="form-input" id="register-username" placeholder="请输入用户名">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">邮箱地址</label>
            <div class="input-wrapper">
              <span class="input-icon">📧</span>
              <input type="email" class="form-input" id="register-email" placeholder="请输入邮箱">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">密码</label>
            <input type="password" class="form-input" id="register-password" placeholder="请输入密码（至少8位）">
          </div>
          <div class="form-group">
            <label class="form-label">确认密码</label>
            <input type="password" class="form-input" id="register-confirm" placeholder="请再次输入密码">
          </div>
          <button class="login-button" id="register-btn">注册</button>
          <div class="register-section">
            已有账号？<span class="register-link" data-switch="login">立即登录</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        const tabName = this.dataset.tab;
        document.querySelectorAll('.tab-content').forEach(content => {
          content.classList.remove('active');
        });
        document.getElementById(tabName + '-tab').classList.add('active');
      });
    });

    // Switch between tabs via register link
    document.querySelectorAll('.register-link[data-switch]').forEach(link => {
      link.addEventListener('click', function() {
        const tabName = this.dataset.switch;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`.tab[data-tab="${tabName}"]`).classList.add('active');
        document.querySelectorAll('.tab-content').forEach(content => {
          content.classList.remove('active');
        });
        document.getElementById(tabName + '-tab').classList.add('active');
      });
    });

    // Login handler
    document.getElementById('login-btn').addEventListener('click', function() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = this;

      if (!email || !password) {
        alert('请输入邮箱和密码');
        return;
      }

      btn.disabled = true;
      btn.textContent = '登录中...';

      setTimeout(() => {
        alert('登录成功！');
        btn.disabled = false;
        btn.textContent = '登录';
      }, 1500);
    });

    // Register handler
    document.getElementById('register-btn').addEventListener('click', function() {
      const username = document.getElementById('register-username').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      const confirm = document.getElementById('register-confirm').value;
      const btn = this;

      if (!username || !email || !password || !confirm) {
        alert('请填写所有字段');
        return;
      }

      if (password !== confirm) {
        alert('两次密码输入不一致');
        return;
      }

      btn.disabled = true;
      btn.textContent = '注册中...';

      setTimeout(() => {
        alert('注册成功！请登录');
        btn.disabled = false;
        btn.textContent = '注册';
        // Switch to login tab
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector('.tab[data-tab="login"]').classList.add('active');
        document.querySelectorAll('.tab-content').forEach(content => {
          content.classList.remove('active');
        });
        document.getElementById('login-tab').classList.add('active');
      }, 1500);
    });

    // Enter key for login form
    document.getElementById('login-password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('login-btn').click();
      }
    });
  </script>
</body>
</html>
