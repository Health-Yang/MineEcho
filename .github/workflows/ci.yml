name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/bff/package-lock.json
            apps/console/package-lock.json

      - name: Install BFF dependencies
        run: npm --prefix apps/bff ci

      - name: Install Console dependencies
        run: npm --prefix apps/console ci --ignore-scripts

      - name: Check release tree
        run: npm run check:release

      - name: Verify build and focused tests
        run: npm run verify
